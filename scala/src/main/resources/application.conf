# =============================================================
# SparkShield — Application Configuration
# Edit this file to match your local environment.
# =============================================================

sparkshield {

  # Path to CICIDS2017 CSV directory (override with env var SPARKSHIELD_DATASET_DIR)
  dataset.dir = ${?HOME}"/Downloads/MachineLearningCVE"

  # Which CSV files to load (comma-separated basenames; "ALL" loads all)
  dataset.files = "ALL"

  # Fraction of each file to sample for quick runs (1.0 = full file)
  dataset.sample.fraction = 1.0

  # Fraction to use for a single quick-test file
  dataset.quicktest.file = "Monday-WorkingHours.pcap_ISCX.csv"

  results {
    dir     = "results"
    metrics = "results/metrics"
    logs    = "results/logs"
    models  = "models"
  }

  spark {
    app.name = "SparkShield"
    # Override master for cluster submission
    master   = "local[*]"
    driver.memory  = "2g"
    executor.memory = "2g"
    log.level = "WARN"
  }

  kafka {
    bootstrap.servers = "localhost:9092"
    topic             = "network-flows"
    # Records per second sent by producer (0 = as fast as possible)
    producer.rate.per.second = 100
    # Number of records to publish (0 = all)
    producer.record.limit    = 0
  }

  ml {
    seed           = 42
    train.fraction = 0.8
    test.fraction  = 0.2
    max.iter       = 20
    kmeans.k       = 5
  }
}
